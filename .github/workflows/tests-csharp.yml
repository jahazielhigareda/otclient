name: Tests - C# (OTClient.Core)

on:
  pull_request:
    paths:
      - "csharp/**"
      - ".github/workflows/tests-csharp.yml"
  push:
    branches:
      - main
    paths:
      - "csharp/**"

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore csharp/OTClient.slnx

      - name: Build (warnings as errors)
        run: dotnet build csharp/OTClient.slnx --no-restore --configuration Release

      - name: Run unit tests
        run: >
          dotnet test csharp/OTClient.slnx
          --no-build
          --configuration Release
          --logger "console;verbosity=normal"
          --results-directory TestResults
          -- xunit.parallelizeTestCollections=false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.xml
          if-no-files-found: ignore
